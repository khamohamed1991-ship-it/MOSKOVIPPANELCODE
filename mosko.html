<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOSKO CHEATS CODE FILE</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:white;
}

/* Background */
body::before{
    content:"";
    position:fixed;
    width:430px;
    height:430px;
    border-radius:50%;
    background:rgba(0,120,255,.08);
    box-shadow:0 0 100px rgba(0,120,255,.12);
    animation:glow 6s ease-in-out infinite;
}

@keyframes glow{
    0%,100%{
        transform:scale(.9);
        opacity:.6;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}

/* Particles */
canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* Title */
.title{
    position:fixed;
    top:35px;
    left:0;
    width:100%;
    text-align:center;

    color:#45b5ff;
    font-size:clamp(20px,5vw,38px);
    font-weight:900;
    letter-spacing:2px;

    text-shadow:
        0 0 8px #008cff,
        0 0 25px #0077ff;

    animation:titleGlow 3s infinite ease-in-out;

    z-index:5;
}

@keyframes titleGlow{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.3);
    }
}

/* Card */
.card{
    position:relative;
    z-index:4;

    width:min(430px,88vw);
    padding:29px;

    border-radius:25px;

    background:rgba(5,12,21,.94);

    border:1px solid rgba(20,160,255,.65);

    box-shadow:
        0 0 25px rgba(0,130,255,.25),
        0 20px 60px rgba(0,0,0,.8),
        inset 0 0 25px rgba(0,130,255,.07);

    animation:cardIn .8s ease-out;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.92);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* Moving border */
.card::before{
    content:"";

    position:absolute;
    inset:-1px;

    border-radius:26px;

    border:1px solid transparent;
    border-top-color:#00aaff;

    filter:drop-shadow(0 0 7px #008cff);

    animation:borderMove 4s linear infinite;

    pointer-events:none;
}

@keyframes borderMove{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* Code box */
.code{
    position:relative;

    width:100%;
    padding:18px;

    border-radius:15px;

    background:#03090f;

    border:1px solid rgba(20,160,255,.6);

    color:#55baff;

    font-size:23px;
    font-weight:900;

    letter-spacing:1px;

    text-align:center;

    box-shadow:
        inset 0 0 25px rgba(0,130,255,.12);

    overflow:hidden;
}

/* Light passing through code */
.code::after{
    content:"";

    position:absolute;

    top:0;
    left:-50%;

    width:35%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(100,200,255,.2),
        transparent
    );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

@keyframes shine{
    0%,30%{
        left:-50%;
    }

    70%,100%{
        left:130%;
    }
}

/* Button */
button{
    position:relative;

    width:100%;

    margin-top:17px;

    padding:15px;

    border-radius:15px;

    border:1px solid #159cff;

    background:linear-gradient(
        135deg,
        #087fd8,
        #0455aa
    );

    color:white;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 18px rgba(0,130,255,.3);

    transition:.2s;

    overflow:hidden;
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(0,145,255,.6);
}

button:active{
    transform:scale(.97);
}

/* Success */
.status{
    height:22px;

    margin-top:11px;

    text-align:center;

    color:#35ff72;

    font-size:14px;

    font-weight:900;

    opacity:0;

    transition:.25s;
}

.status.show{
    opacity:1;
}

.success .code{
    border-color:#35ff72;

    box-shadow:
        0 0 20px rgba(50,255,110,.25);
}

.success button{
    background:#087c3d;

    border-color:#35ff72;
}

/* Mobile */
@media(max-width:500px){

    .title{
        top:25px;
        font-size:20px;
        letter-spacing:1px;
    }

    .card{
        padding:23px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="title">
    MOSKO CHEATS CODE FILE
</div>

<div class="card" id="card">

    <div class="code" id="code">
        MOSKO-VIP-ONLINE
    </div>

    <button id="copy">
        Copy Code
    </button>

    <div class="status" id="status">
        Copy secces
    </div>

</div>

<script>

const canvas = document.getElementById("particles");

const ctx = canvas.getContext("2d");

let width;
let height;

let particles = [];

const PARTICLE_COUNT = 75;


/* Canvas size */

function resize(){

    width = window.innerWidth;

    height = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = width * dpr;

    canvas.height = height * dpr;

    canvas.style.width = width + "px";

    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* Create particle */

function createParticle(){

    return {

        x:Math.random()*width,

        y:-10,

        size:Math.random()*2 + .5,

        speed:Math.random()*2 + .7,

        opacity:Math.random()*.7+.2,

        drift:(Math.random()-.5)*.4
    };
}


/* Start particles */

function startParticles(){

    particles=[];

    for(let i=0;i<PARTICLE_COUNT;i++){

        const p=createParticle();

        p.y=Math.random()*height;

        particles.push(p);
    }
}


/* Animation */

function animate(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for(const p of particles){

        p.y += p.speed;

        p.x += p.drift;

        if(p.y > height + 10){

            p.y=-10;

            p.x=Math.random()*width;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(35,165,255,"+
            p.opacity+
            ")";

        ctx.shadowBlur=7;

        ctx.shadowColor="#008cff";

        ctx.fill();
    }

    requestAnimationFrame(animate);
}


/* Copy */

document.getElementById("copy").onclick=async function(){

    const code=
        document.getElementById("code").textContent.trim();

    const status=
        document.getElementById("status");

    const card=
        document.getElementById("card");

    try{

        await navigator.clipboard.writeText(code);

    }catch(error){

        const textarea=
            document.createElement("textarea");

        textarea.value=code;

        textarea.style.position="fixed";

        textarea.style.opacity="0";

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();
    }

    card.classList.add("success");

    status.classList.add("show");

    setTimeout(function(){

        card.classList.remove("success");

        status.classList.remove("show");

    },1800);

};


/* Mouse 3D effect */

if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches
){

    const card=
        document.getElementById("card");

    card.addEventListener(
        "mousemove",
        function(event){

            const rect=
                card.getBoundingClientRect();

            const x=
                (event.clientX-rect.left)/
                rect.width-.5;

            const y=
                (event.clientY-rect.top)/
                rect.height-.5;

            card.style.transform=
                "perspective(700px) "+
                "rotateX("+(-y*3)+"deg) "+
                "rotateY("+(x*4)+"deg)";
        }
    );

    card.addEventListener(
        "mouseleave",
        function(){

            card.style.transform="";
        }
    );
}


window.addEventListener(
    "resize",
    function(){

        resize();

        startParticles();
    }
);


resize();

startParticles();

animate();

</script>

</body>
</html>
